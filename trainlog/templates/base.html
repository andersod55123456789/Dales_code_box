<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TrainLog{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<nav class="nav">
  <span class="brand">TrainLog</span>
  <a href="/day/today">Today</a>
  <a href="/checkin">Check-in{% if not checkin_done %}<span class="dot"></span>{% endif %}</a>
  <a href="/progress">Progress</a>
  <a href="/character">Character</a>
  <a href="/trophies">Trophies</a>
  <a href="/tests">Tests</a>
  <a href="/program">Program</a>
  <button type="button" id="garmin-sync-btn" title="Import activities from the plugged-in Garmin watch">Sync Watch</button>
  {% if xp %}
  <span class="xp-widget" title="Level {{ xp.level }} - {{ xp.total_xp }} XP total">
    <span class="xp-badge">Lv {{ xp.level }}</span>
    <span class="xp-bar"><span class="xp-fill" style="width:{{ (100 * xp.xp_into_level / xp.xp_for_next_level)|round(0,'floor')|int if xp.xp_for_next_level else 0 }}%"></span></span>
    <span class="xp-frac muted">{{ xp.xp_into_level }}/{{ xp.xp_for_next_level }}</span>
  </span>
  {% endif %}
</nav>
<main class="wrap">{% block content %}{% endblock %}</main>
<div id="toast" class="toast" hidden></div>
<script>
(function () {
  const btn = document.getElementById('garmin-sync-btn');
  if (!btn) return;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(t._h);
    t._h = setTimeout(() => { t.hidden = true; }, 3000);
  }
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    const label = btn.textContent;
    btn.textContent = 'Syncing...';
    try {
      const r = await fetch('/api/garmin/sync', { method: 'POST' });
      const d = await r.json();
      if (!d.ok) { toast(d.error || 'Sync failed'); return; }
      if (d.imported > 0) {
        toast(`Imported ${d.imported} activit${d.imported === 1 ? 'y' : 'ies'} from watch`);
        setTimeout(() => location.reload(), 900);
      } else {
        toast('Watch synced - nothing new to import');
      }
    } catch (e) {
      toast('Sync failed - server unreachable');
    } finally {
      btn.disabled = false;
      btn.textContent = label;
    }
  });
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
